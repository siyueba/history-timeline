    const EVENTS = [{"id":"humencigarette","year":1839,"endYear":1839,"at":1839.42,"date":"1839年6月3日—25日","title":"虎门销烟","stamp":"禁烟","kind":"resistance","place":"广东·虎门","marker":[113.6,22.8],"context":"19世纪初，英国为扭转贸易逆差，向中国大量走私鸦片。白银外流、财政拮据、军队战斗力削弱，烟毒泛滥严重损害国民身心。1838年底，道光帝命林则徐为钦差大臣，赴广东查禁鸦片。","cause":"英国资本主义扩张需要打开中国市场，以鸦片作为经济侵略的手段；清政府面临统治危机，禁烟成为朝野上下的共同要求。","figures":["林则徐","道光帝","邓廷桢"],"points":["1839年6月3日至25日，林则徐在虎门海滩当众销毁鸦片237万余斤。","虎门销烟是中国人民禁烟斗争的伟大胜利，显示了中华民族反抗外来侵略的坚强意志。","英国以此为借口，于1840年发动鸦片战争。"],"meaning":"禁烟运动的最高潮，也是鸦片战争的直接导火索。","summary":"虎门海滩销毁鸦片，民族禁烟意志的第一次集中亮相。"},{"id":"opiumwar1","year":1840,"endYear":1842,"at":1840.45,"date":"1840年6月—1842年8月","title":"第一次鸦片战争","stamp":"开端","kind":"war","place":"广州·定海·吴淞·镇江","marker":[118.78,32.06],"context":"1840年6月，英国舰队封锁珠江口，鸦片战争爆发。清军装备落后、指挥失当，定海、吴淞、镇江相继失守，1842年8月英军兵临南京城下。","cause":"英国完成工业革命，急需商品市场与原料产地；清政府闭关锁国、政治腐败、军备废弛，落后就要挨打。","figures":["道光帝","琦善","关天培","陈化成"],"points":["中国近代史的开端。","中国开始由独立的封建社会沦为半殖民地半封建社会。","社会主要矛盾变为外国资本主义与中华民族、封建主义与人民大众的矛盾。","革命任务变为反对外国侵略、反对本国封建统治（反帝反封建）。"],"meaning":"战后签订《南京条约》，中国主权和领土完整遭到破坏，社会性质发生根本变化。","summary":"国门被炮舰轰开，中国近代史由此开端。"},{"id":"nanjingtreaty","year":1842,"endYear":1842,"at":1842.66,"date":"1842年8月29日","title":"《南京条约》","stamp":"条约","kind":"war","place":"南京·下关江面","marker":[118.78,32.06],"context":"1842年8月，清政府被迫在南京下关江面的英国军舰皋华丽号上签约，中国近代史上第一个不平等条约由此诞生。","cause":"军事上的惨败与清廷的妥协退让，使谈判完全按侵略者的条件进行。","figures":["耆英","伊里布","璞鼎查"],"points":["割香港岛给英国。","赔款2100万银元。","开放广州、厦门、福州、宁波、上海五处为通商口岸。","英商进出口货物应纳税款，中国须同英国商定（协定关税）。","附件规定领事裁判权、片面最惠国待遇、在通商口岸租地建屋（租界）。"],"meaning":"中国开始沦为半殖民地半封建社会，条约体系成为列强控制中国的主要工具。","summary":"割地、赔款、五口通商、协定关税——不平等条约体系的开端。"},{"id":"taiping","year":1851,"endYear":1864,"at":1851.03,"date":"1851年1月—1864年7月","title":"太平天国运动","stamp":"对峙","kind":"revolution","place":"广西金田—天京","marker":[118.78,32.06],"context":"鸦片战争后巨额赔款转嫁到农民身上，阶级矛盾激化。洪秀全创立拜上帝会，1851年1月11日在广西桂平金田村起义，建号太平天国。","cause":"外国资本主义侵略与封建剥削双重压迫，农民阶级要求摆脱压迫、获得土地。","figures":["洪秀全","杨秀清","石达开","洪仁玕"],"points":["1853年攻占南京，改名天京，定为都城，建立与清政府对峙的政权。","《天朝田亩制度》是太平天国的建国纲领，反映农民对土地的渴望，但具有空想性。","《资政新篇》是中国近代第一个比较系统的发展资本主义的方案。","1856年天京事变，太平天国由盛转衰；1864年天京陷落，运动失败。"],"meaning":"中国旧式农民战争的最高峰，沉重打击了清王朝统治和外国侵略势力；农民阶级不是先进生产力的代表，不能领导中国革命取得胜利。","summary":"建都天京，与清廷南北对峙，旧式农民战争的最高峰。"},{"id":"opiumwar2","year":1856,"endYear":1860,"at":1856.78,"date":"1856年10月—1860年10月","title":"第二次鸦片战争","stamp":"加深","kind":"war","place":"广州—天津—北京","marker":[116.4,39.9],"context":"英法为扩大侵略权益，以“亚罗号事件”“马神甫事件”为借口发动战争。1860年英法联军攻入北京，火烧圆明园，咸丰帝逃往热河。","cause":"列强要求进一步打开中国市场、扩大侵略权益，清政府拒绝“修约”要求。","figures":["咸丰帝","奕䜣","僧格林沁"],"points":["1858年《天津条约》：外国公使进驻北京；增开十处通商口岸；外国军舰、商船可在长江各口岸通航；外国人可到内地游历、传教。","1860年《北京条约》：增开天津为商埠；割九龙司地方一区；赔款增加；准许华工出国。","沙俄趁机侵占中国东北、西北共150多万平方公里领土。"],"meaning":"中国半殖民地化程度进一步加深；清政府开始被列强控制，中外反动势力公开勾结。","summary":"圆明园被焚，主权进一步丧失，半殖民地化程度加深。"},{"id":"yangwu","year":1861,"endYear":1895,"at":1861.11,"date":"1861年—1895年","title":"洋务运动","stamp":"自强","kind":"reform","place":"上海·福州·天津","marker":[121.47,31.23],"context":"第二次鸦片战争后，清政府内忧外患。一部分官僚主张“师夷长技以自强”，以“自强”“求富”为口号，创办近代军事工业和民用工业。","cause":"内忧（太平天国）与外患（列强侵略）交织，清统治集团内部出现主张学习西方技术的洋务派。","figures":["奕䜣","曾国藩","李鸿章","左宗棠","张之洞"],"points":["1861年设立总理各国事务衙门。","1865年江南制造总局、1866年福州船政局、1872年轮船招商局、1878年开平矿务局。","1888年北洋海军成军；1895年甲午战败宣告洋务运动破产。","洋务运动是中国近代化的开端，但没有使中国走上富强道路。"],"meaning":"引进西方先进技术，客观上刺激了中国民族资本主义的产生；只学技术、不改制度，注定失败。","summary":"师夷长技以自强，中国近代化的第一步。"},{"id":"xinjiang","year":1875,"endYear":1878,"at":1875.42,"date":"1875年—1878年","title":"左宗棠收复新疆","stamp":"守土","kind":"war","place":"新疆·乌鲁木齐","marker":[87.62,43.82],"context":"1865年中亚浩罕汗国阿古柏入侵新疆，1871年沙俄出兵占领伊犁。1875年清政府任命左宗棠为钦差大臣督办新疆军务。","cause":"边疆危机加深，西北领土面临被瓜分的危险。","figures":["左宗棠","曾纪泽"],"points":["采取“先北后南、缓进急战”的方针。","1878年收复新疆大部；1881年《伊犁条约》收回伊犁。","1884年新疆建省，加强了中央对边疆的管理。"],"meaning":"近代中国反抗外来侵略、维护国家统一的重要胜利。","summary":"抬棺西征，收复新疆，1884年建省。"},{"id":"francewar","year":1883,"endYear":1885,"at":1883.9,"date":"1883年—1885年","title":"中法战争","stamp":"边患","kind":"war","place":"福建马尾—广西镇南关","marker":[106.72,22.1],"context":"法国侵略越南并进犯中国西南。1884年马尾海战，福建水师覆没；1885年冯子材在镇南关大败法军。","cause":"法国企图以越南为跳板打开中国西南门户。","figures":["冯子材","刘铭传","李鸿章"],"points":["1885年镇南关大捷，清军取得陆地战场胜利。","“不败而败”：清政府妥协签约，《中法新约》承认法国对越南的“保护权”，中国西南门户洞开。","1885年台湾建省，加强对台湾的管理。"],"meaning":"军事上取得胜利、外交上却丧权，反映清政府的腐败无能。","summary":"镇南关大捷却“不败而败”，西南门户洞开。"},{"id":"jiawu","year":1894,"endYear":1895,"at":1894.52,"date":"1894年7月—1895年4月","title":"甲午中日战争","stamp":"转折","kind":"war","place":"黄海—辽东—威海卫","marker":[122.12,37.51],"context":"日本明治维新后制定“大陆政策”，1894年借朝鲜东学党起义挑起战争。黄海海战中北洋舰队损失惨重，1895年威海卫战役北洋海军全军覆没。","cause":"日本军国主义扩张野心；清政府避战求和、准备不足。","figures":["邓世昌","丁汝昌","李鸿章","伊藤博文"],"points":["平壤战役、黄海海战、辽东战役（旅顺大屠杀）、威海卫战役。","1895年《马关条约》：割辽东半岛（后赎回）、台湾全岛及所有附属各岛屿、澎湖列岛给日本。","赔款2亿两白银；开放沙市、重庆、苏州、杭州为商埠。","允许日本在通商口岸开设工厂，列强对华经济侵略由商品输出转为资本输出。"],"meaning":"大大加深了中国的半殖民地化程度，列强掀起瓜分中国的狂潮，也刺激了中华民族的觉醒。","summary":"北洋海军覆没，《马关条约》签订，瓜分狂潮随之而来。"},{"id":"gongche","year":1895,"endYear":1895,"at":1895.35,"date":"1895年5月","title":"公车上书","stamp":"维新","kind":"reform","place":"北京","marker":[116.4,39.9],"context":"《马关条约》签订的消息传来，举国震动。康有为、梁启超联合各省举人上书光绪帝，反对议和，请求变法图强。","cause":"民族危机空前严重，民族资产阶级开始登上政治舞台。","figures":["康有为","梁启超","光绪帝"],"points":["1895年5月，康有为、梁启超发动“公车上书”。","标志着维新变法运动由思想宣传进入政治实践。","康有为《新学伪经考》《孔子改制考》为变法提供理论依据。"],"meaning":"维新变法运动的开端，资产阶级改良思潮发展为政治运动。","summary":"举人上书言变法，维新运动由思想走向行动。"},{"id":"wuxu","year":1898,"endYear":1898,"at":1898.44,"date":"1898年6月11日—9月21日","title":"戊戌变法","stamp":"百日","kind":"reform","place":"北京","marker":[116.4,39.9],"context":"1897年德国强占胶州湾，民族危机空前严重。1898年6月11日光绪帝颁布“明定国是”诏书，变法开始，历时103天，史称“百日维新”。","cause":"甲午战败与瓜分狂潮的刺激；民族资本主义初步发展，民族资产阶级要求政治变革。","figures":["光绪帝","康有为","梁启超","谭嗣同"],"points":["政治：裁撤冗官冗员，允许官民上书言事。","经济：鼓励私人兴办工矿企业。","文化：废八股、办新式学堂（京师大学堂）。","军事：裁减绿营、训练新式军队。","1898年9月21日慈禧发动政变，变法失败，谭嗣同等“戊戌六君子”被杀。"],"meaning":"一场爱国救亡的政治运动，一次思想解放潮流；证明资产阶级改良道路在半殖民地半封建的中国行不通。","summary":"103天维新失败，改良道路走不通。"},{"id":"boxer","year":1899,"endYear":1901,"at":1899.7,"date":"1899年—1901年9月","title":"义和团与八国联军侵华","stamp":"沉沦","kind":"war","place":"山东·直隶·北京","marker":[116.4,39.9],"context":"19世纪末列强掀起瓜分狂潮，山东、直隶一带爆发以农民为主体的反帝爱国运动。1900年八国联军以“保护使馆”为名侵华，攻占北京，慈禧携光绪西逃。","cause":"列强瓜分中国、教会势力扩张，激起民众反抗；清政府一度利用义和团。","figures":["慈禧太后","聂士成","瓦德西"],"points":["义和团提出“扶清灭洋”口号，具有强烈的爱国性质，但带有盲目排外色彩。","1901年《辛丑条约》：赔款4.5亿两白银，分39年还清，本息合计约9.8亿两。","划北京东交民巷为使馆界，允许各国驻兵；拆毁大沽炮台。","禁止中国人民成立或加入反帝性质的组织。"],"meaning":"中国完全沦为半殖民地半封建社会，清政府成为帝国主义统治中国的工具。","summary":"《辛丑条约》签订，中国完全陷入半殖民地深渊。"},{"id":"tongmenghui","year":1905,"endYear":1905,"at":1905.63,"date":"1905年8月20日","title":"中国同盟会成立","stamp":"政党","kind":"revolution","place":"日本东京（总部）","marker":[113.26,23.13],"context":"1905年8月，孙中山在日本东京联合兴中会、华兴会、光复会等成立中国同盟会，提出“驱除鞑虏，恢复中华，创立民国，平均地权”的纲领。","cause":"资产阶级革命思想广泛传播，革命形势需要统一的全国性政党。","figures":["孙中山","黄兴"],"points":["同盟会是近代中国第一个全国性的资产阶级革命政党。","孙中山把纲领阐发为民族、民权、民生三大主义，成为资产阶级民主革命的指导思想。","机关报为《民报》，与保皇派展开论战。"],"meaning":"使全国资产阶级革命派有了统一组织和明确纲领，推动了革命形势的发展。","summary":"三民主义纲领确立，资产阶级革命派有了全国性政党。"},{"id":"xinhai","year":1911,"endYear":1912,"at":1911.77,"date":"1911年10月10日—1912年2月","title":"辛亥革命","stamp":"共和","kind":"revolution","place":"武昌—南京—北京","marker":[114.31,30.59],"context":"1911年10月10日武昌起义爆发，各省纷纷响应，清朝统治土崩瓦解。1912年1月1日中华民国成立，孙中山任临时大总统，定都南京。","cause":"清末新政与预备立宪未能挽救统治危机；民族资本主义发展和资产阶级力量壮大；同盟会领导的武装起义此起彼伏。","figures":["孙中山","黄兴","黎元洪","袁世凯"],"points":["1912年1月1日中华民国成立，孙中山任临时大总统，定都南京。","1912年3月颁布《中华民国临时约法》，是中国第一部具有资产阶级共和国宪法性质的重要文件。","推翻了清王朝，结束了两千多年的君主专制制度。","没有改变中国半殖民地半封建社会的性质，没有完成反帝反封建的任务。"],"meaning":"近代中国比较完全意义上的资产阶级民主革命，使民主共和观念深入人心。","summary":"武昌起义，帝制终结，共和观念深入人心。"},{"id":"qing-end","year":1912,"endYear":1912,"at":1912.12,"date":"1912年2月12日","title":"清帝退位 · 清朝灭亡","stamp":"清亡","kind":"revolution","place":"北京·紫禁城","marker":[116.4,39.9],"context":"武昌起义后各省纷纷独立，1912年1月1日中华民国成立。在袁世凯的逼宫与南方革命党人的妥协下，1912年2月12日隆裕太后以宣统帝名义颁布退位诏书。","cause":"辛亥革命动摇了清朝统治基础；袁世凯手握北洋军、两面施压；革命派力量不足，选择以让位换取清帝退位。","figures":["溥仪","隆裕太后","袁世凯","孙中山"],"points":["1912年2月12日，清帝退位，清朝灭亡，共历十二帝、二百六十八年。","结束了两千多年的君主专制制度，民主共和成为不可阻挡的历史潮流。","袁世凯窃取革命果实，同年3月10日在北京就任临时大总统。"],"meaning":"中国历史上最后一个封建王朝终结，但反帝反封建的任务并未完成。","summary":"宣统退位，两百六十八年清王朝画上句号。"},{"id":"beiyang","year":1912,"endYear":1912,"at":1912.19,"date":"1912年3月10日","title":"北洋政府建立","stamp":"北洋","kind":"revolution","place":"北京","marker":[116.4,39.9],"context":"1912年3月10日，袁世凯在北京就任中华民国临时大总统，4月临时政府迁往北京，北洋军阀统治开始，直至1928年。","cause":"袁世凯凭借北洋军的实力与列强的支持，窃取了辛亥革命的果实。","figures":["袁世凯","黎元洪","段祺瑞","冯国璋"],"points":["1913年宋教仁被刺，孙中山发动“二次革命”失败。","1915年袁世凯复辟帝制（洪宪），1916年被迫取消，同年6月病死。","此后直系、皖系、奉系等军阀割据混战，政局动荡。","1915年袁世凯接受日本“二十一条”的大部分内容。"],"meaning":"北洋政府代表大地主大资产阶级利益，中国陷入军阀割据的黑暗局面。","summary":"袁世凯窃国，北洋军阀统治开始。"},{"id":"xinwenhua","year":1915,"endYear":1919,"at":1915.68,"date":"1915年9月—1919年","title":"新文化运动","stamp":"启蒙","kind":"thought","place":"上海·北京","marker":[121.47,31.23],"context":"1915年陈独秀在上海创办《青年杂志》（后改名《新青年》），高举“民主”与“科学”两面大旗，新文化运动兴起。","cause":"辛亥革命后民主共和名存实亡，袁世凯掀起尊孔复古逆流；西方民主思想进一步传入。","figures":["陈独秀","李大钊","胡适","鲁迅"],"points":["提倡民主，反对专制；提倡科学，反对迷信。","提倡新道德，反对旧道德（鲁迅《狂人日记》）。","提倡新文学，反对旧文学（胡适《文学改良刍议》）。","十月革命后，李大钊发表《庶民的胜利》《布尔什维主义的胜利》，马克思主义开始在中国传播。"],"meaning":"一次空前的思想解放运动，为马克思主义在中国的传播创造了条件。","summary":"民主与科学的启蒙，马克思主义开始传入。"},{"id":"wusi","year":1919,"endYear":1919,"at":1919.34,"date":"1919年5月4日","title":"五四运动","stamp":"新民主","kind":"resistance","place":"北京—上海","marker":[116.4,39.9],"context":"1919年巴黎和会上中国外交失败，列强将德国在山东的权益转让给日本，激起全国人民的强烈愤慨。","cause":"帝国主义加紧侵略、北洋军阀黑暗统治；新文化运动启发民智，十月革命昭示新道路。","figures":["陈独秀","李大钊","周恩来"],"points":["5月4日北京学生游行示威，提出“外争主权，内除国贼”“还我青岛”等口号。","6月后运动中心转向上海，工人阶级登上政治舞台，成为运动主力。","是一次彻底反帝反封建的爱国运动，是中国新民主主义革命的开端。"],"meaning":"促进了马克思主义与中国工人运动的结合，为中国共产党的成立作了思想上和干部上的准备。","summary":"五四风雷，新民主主义革命的开端。"},{"id":"ccp","year":1921,"endYear":1921,"at":1921.56,"date":"1921年7月23日","title":"中国共产党成立","stamp":"开天辟地","kind":"revolution","place":"上海—嘉兴南湖","marker":[121.47,31.23],"context":"1921年7月23日，中国共产党第一次全国代表大会在上海召开，后转移到浙江嘉兴南湖的一艘游船上闭幕。","cause":"马克思主义传播、工人运动发展，各地共产党早期组织建立。","figures":["陈独秀","李大钊","毛泽东","董必武"],"points":["确定党的名称为“中国共产党”。","奋斗目标：推翻资产阶级政权，建立无产阶级专政，实现共产主义。","选举陈独秀为中央局书记。","中国共产党的成立是“开天辟地的大事变”，中国革命的面貌从此焕然一新。"],"meaning":"中国革命有了坚强的领导核心、科学的指导思想和明确的奋斗目标。","summary":"南湖红船，中国革命的面貌焕然一新。"},{"id":"kmt1","year":1924,"endYear":1927,"at":1924.05,"date":"1924年1月—1927年7月","title":"第一次国共合作","stamp":"合作","kind":"revolution","place":"广州","marker":[113.26,23.13],"context":"1924年1月国民党一大在广州召开，孙中山重新解释三民主义，确立“联俄、联共、扶助农工”三大政策，国共第一次合作正式形成。","cause":"反帝反封建的共同目标；孙中山在屡次失败后寻求新的革命力量。","figures":["孙中山","李大钊","毛泽东","蒋介石"],"points":["新三民主义成为国共合作的政治基础。","1924年5月创办黄埔军校，蒋介石任校长，周恩来任政治部主任。","1927年蒋介石、汪精卫相继叛变革命，第一次国共合作破裂。"],"meaning":"推动了国民革命高潮的到来。","summary":"国共携手，黄埔建军，国民革命兴起。"},{"id":"northward","year":1926,"endYear":1928,"at":1926.53,"date":"1926年7月—1928年12月","title":"北伐战争","stamp":"北伐","kind":"war","place":"广州—武汉—南京","marker":[114.31,30.59],"context":"1926年7月国民革命军出师北伐，目标是推翻吴佩孚、孙传芳、张作霖等北洋军阀的统治。","cause":"国民革命高潮到来，工农运动高涨，迫切要求推翻军阀统治。","figures":["蒋介石","叶挺","吴佩孚"],"points":["湖南、湖北战场是主战场，汀泗桥、贺胜桥战役击溃吴佩孚主力。","1927年国民政府由广州迁往武汉。","1927年四一二反革命政变、七一五“分共”，国民革命失败。","1928年张学良东北易帜，南京国民政府形式上统一全国。"],"meaning":"基本推翻北洋军阀统治，但革命成果被国民党右派窃取。","summary":"出师北伐，军阀统治崩解，革命成果却被窃取。"},{"id":"nanjing-gov","year":1927,"endYear":1927,"at":1927.3,"date":"1927年4月18日","title":"南京国民政府成立","stamp":"国民政府","kind":"revolution","place":"南京","marker":[118.78,32.06],"context":"1927年4月12日蒋介石在上海发动反革命政变，4月18日在南京另立国民政府；7月汪精卫在武汉“分共”，第一次国共合作彻底破裂。","cause":"国民党右派背叛革命，国共合作的统一战线破裂。","figures":["蒋介石","汪精卫","宋子文"],"points":["1925年7月广州国民政府成立，1927年1月迁往武汉。","1927年4月18日南京国民政府成立，代表大地主大资产阶级的利益。","1928年张学良东北易帜，南京国民政府形式上统一全国。"],"meaning":"国民党一党专政的统治确立，中国革命转入土地革命战争时期。","summary":"四一二政变后，南京国民政府成立。"},{"id":"nanchang","year":1927,"endYear":1930,"at":1927.58,"date":"1927年8月—1930年","title":"南昌起义与井冈山道路","stamp":"星火","kind":"revolution","place":"南昌—井冈山","marker":[115.9,28.68],"context":"大革命失败后，1927年8月1日周恩来、贺龙、朱德等领导南昌起义，打响武装反抗国民党反动统治的第一枪。8月7日八七会议确定土地革命和武装反抗国民党反动统治的总方针。","cause":"国民党右派叛变革命，共产党人认识到必须独立领导武装斗争。","figures":["周恩来","朱德","毛泽东"],"points":["1927年9月毛泽东领导秋收起义，10月创建井冈山革命根据地。","井冈山道路：农村包围城市、武装夺取政权。","1928年朱德、毛泽东井冈山会师，成立中国工农红军第四军。"],"meaning":"把马克思主义基本原理同中国革命具体实际相结合的成功创举。","summary":"枪杆子里出政权，农村包围城市的道路开辟。"},{"id":"918","year":1931,"endYear":1936,"at":1931.71,"date":"1931年9月18日","title":"九一八事变","stamp":"国难","kind":"war","place":"沈阳","marker":[123.43,41.8],"context":"1931年9月18日夜，日本关东军炸毁南满铁路柳条湖段，反诬中国军队所为，进攻沈阳北大营。张学良执行不抵抗政策，东北迅速沦陷。","cause":"日本为摆脱经济危机、实现“大陆政策”，蓄谋发动侵略。","figures":["张学良","蒋介石","土肥原贤二"],"points":["中国人民抗日战争的起点，世界反法西斯战争的序幕。","1932年日本扶植伪满洲国，东北沦为殖民地。","东北抗日义勇军、抗日联军坚持斗争。"],"meaning":"中华民族危机空前加深，抗日救亡运动高涨。","summary":"东北沦陷，十四年抗战由此开始。"},{"id":"longmarch","year":1934,"endYear":1935,"at":1934.78,"date":"1934年10月—1935年10月","title":"红军长征（战略转移）","stamp":"转折","kind":"revolution","place":"瑞金—遵义—陕北","marker":[116.03,25.85],"context":"第五次反“围剿”失败，1934年10月中央红军被迫实行战略转移，开始长征。","cause":"“左”倾错误导致第五次反“围剿”失利，根据地难以坚守。","figures":["毛泽东","周恩来","朱德"],"points":["1934年10月，中央红军从江西瑞金等地出发，开始战略转移。","湘江战役后，中央红军由8.6万余人锐减到3万余人，“左”倾错误使红军付出惨重代价。","1935年10月，中央红军到达陕北吴起镇，与陕北红军会师。"],"meaning":"保存了党和红军的基干力量，铸就了伟大的长征精神。","summary":"第五次反“围剿”失败后的战略转移由此开始。"},{"id":"zunyi","year":1935,"endYear":1935,"at":1935.04,"date":"1935年1月15日—17日","title":"遵义会议","stamp":"转折","kind":"revolution","place":"贵州·遵义","marker":[106.93,27.7],"context":"长征初期“左”倾错误导致湘江战役惨重损失，红军由8.6万余人减至3万余人。1935年1月，中共中央在遵义召开政治局扩大会议。","cause":"第五次反“围剿”失败和长征初期的严重挫折，使党内对“左”倾军事路线产生怀疑。","figures":["毛泽东","周恩来","张闻天","博古"],"points":["纠正了博古、李德在军事上和组织上的“左”倾错误。","确立了以毛泽东为代表的马克思主义正确路线在党中央的领导地位。","是党的历史上一个生死攸关的转折点。","是中国共产党第一次独立自主地运用马克思主义基本原理解决自己的路线、方针和政策问题。"],"meaning":"挽救了党、挽救了红军、挽救了中国革命，标志着中国共产党从幼稚走向成熟。","summary":"生死攸关的转折点，毛泽东的领导地位确立。"},{"id":"sidu","year":1935,"endYear":1935,"at":1935.12,"date":"1935年1月—3月","title":"四渡赤水","stamp":"奇兵","kind":"revolution","place":"川黔滇边·赤水河","marker":[105.7,28.6],"context":"遵义会议后，红军在毛泽东等指挥下，于1935年1月至3月在川黔滇边界四次渡过赤水河，声东击西，摆脱国民党军队的围追堵截。","cause":"敌军重兵围堵，红军必须摆脱被动、争取主动。","figures":["毛泽东","周恩来","朱德","刘伯承"],"points":["一渡赤水：土城战斗失利后西渡入川南。","二渡赤水：回师黔北，再占遵义，取得长征以来最大胜利。","三渡赤水：再入川南，诱敌西进；四渡赤水：南渡乌江，佯攻贵阳，威逼昆明。","随后巧渡金沙江，彻底跳出敌军包围圈。"],"meaning":"红军长征中最精彩的一笔，是毛泽东军事指挥艺术和运动战的光辉范例。","summary":"四渡赤水，声东击西，跳出重围。"},{"id":"luding","year":1935,"endYear":1935,"at":1935.4,"date":"1935年5月29日","title":"飞夺泸定桥","stamp":"天险","kind":"revolution","place":"四川·泸定桥","marker":[102.2,29.9],"context":"1935年5月红军抵达大渡河，蒋介石企图让红军成为“石达开第二”。红军强渡安顺场后，先头部队一昼夜奔袭240里，夺取泸定桥。","cause":"前有堵截、后有追兵，红军必须迅速渡过大渡河。","figures":["刘伯承","聂荣臻","杨成武"],"points":["1935年5月25日，红军在安顺场强渡大渡河。","5月29日，22名突击队员冒着弹雨攀铁索夺下泸定桥。","随后翻越夹金山，6月在懋功与红四方面军会师。"],"meaning":"打破了蒋介石围歼红军于大渡河以南的企图。","summary":"一昼夜奔袭240里，飞夺泸定桥。"},{"id":"huining","year":1936,"endYear":1936,"at":1936.78,"date":"1936年10月","title":"红军三大主力会师 · 长征胜利","stamp":"会师","kind":"revolution","place":"甘肃·会宁","marker":[105.05,35.7],"context":"1936年10月，红一、红二、红四方面军在甘肃会宁、静宁将台堡会师，宣告长征胜利结束。","cause":"遵义会议后正确路线确立，各路红军战略转移相继成功。","figures":["毛泽东","朱德","贺龙","张国焘"],"points":["长征行程二万五千里，跨越十一个省。","粉碎了国民党反动派消灭红军的企图，保存了党和红军的基干力量。","铸就了伟大的长征精神。"],"meaning":"中国革命转危为安，为开创革命新局面奠定了基础。","summary":"会宁会师，长征胜利结束。"},{"id":"xian","year":1936,"endYear":1937,"at":1936.95,"date":"1936年12月12日","title":"西安事变","stamp":"转折","kind":"war","place":"西安","marker":[108.94,34.34],"context":"1936年12月12日，张学良、杨虎城扣押蒋介石，逼其停止内战、联共抗日。中国共产党从民族大义出发，主张和平解决。","cause":"日本侵略加剧，全国抗日救亡运动高涨；国民党内部主张抗日的力量增长。","figures":["张学良","杨虎城","周恩来"],"points":["西安事变的和平解决，标志着十年内战基本结束。","抗日民族统一战线初步形成。"],"meaning":"成为时局转换的枢纽，为全民族抗战准备了条件。","summary":"兵谏西安，内战基本结束，统一战线初步形成。"},{"id":"77","year":1937,"endYear":1945,"at":1937.51,"date":"1937年7月7日","title":"七七事变与全面抗战","stamp":"全民族","kind":"war","place":"北平·卢沟桥","marker":[116.2,39.85],"context":"1937年7月7日夜，日军在卢沟桥附近演习，借口士兵失踪，进攻宛平城和卢沟桥，中国守军奋起抵抗。","cause":"日本发动全面侵华战争，中华民族到了最危险的时候。","figures":["佟麟阁","赵登禹","蒋介石"],"points":["中国全民族抗战的开始。","1937年9月国民党公布中共中央提交的国共合作宣言，抗日民族统一战线正式形成。","1937年12月南京大屠杀，30万以上同胞遇难。","正面战场与敌后战场相互配合，共同构成中国抗战的整体。"],"meaning":"中华民族空前团结，抗日战争成为全民族的抗战。","summary":"卢沟桥的枪声，全民族抗战由此展开。"},{"id":"taierzhuang","year":1938,"endYear":1938,"at":1938.2,"date":"1938年3月—10月","title":"台儿庄战役与武汉会战","stamp":"相持","kind":"war","place":"台儿庄—武汉","marker":[117.73,34.56],"context":"1938年3月至4月，李宗仁指挥台儿庄战役，取得抗战以来正面战场的重大胜利。6月至10月武汉会战，抗战进入相持阶段。","cause":"日军企图速战速决，打通南北战场；中国军队以空间换时间。","figures":["李宗仁","彭德怀","冈村宁次"],"points":["1937年9月平型关大捷，是抗战以来中国军队取得的第一个胜利。","台儿庄战役歼敌1万余人，是抗战以来正面战场取得的重大胜利。","武汉会战后，日军速战速决的计划破产，抗日战争进入相持阶段。"],"meaning":"正面战场与敌后战场的配合，粉碎了日军速亡中国的迷梦。","summary":"台儿庄大捷，武汉会战后进入相持阶段。"},{"id":"hundredregiments","year":1940,"endYear":1940,"at":1940.62,"date":"1940年8月—12月","title":"百团大战","stamp":"敌后","kind":"war","place":"华北·正太铁路","marker":[113.58,37.86],"context":"为粉碎日军的“囚笼政策”，1940年下半年彭德怀指挥八路军在华北发动百团大战，破袭交通线、拔除据点。","cause":"日军加紧对敌后根据地的封锁与“扫荡”，国民党内部出现妥协投降倾向。","figures":["彭德怀","聂荣臻"],"points":["抗战期间中国军队主动出击日军的最大规模战役。","提高了共产党和八路军的威望，振奋了全国军民的抗战信心。","敌后战场逐渐成为抗日战争的主战场。"],"meaning":"显示了中国共产党领导的抗日武装力量的作用。","summary":"百团破袭，敌后战场威震华北。"},{"id":"victory","year":1945,"endYear":1945,"at":1945.62,"date":"1945年8月15日—9月9日","title":"抗日战争胜利","stamp":"胜利","kind":"war","place":"南京·受降","marker":[118.78,32.06],"context":"1945年中共七大在延安召开，确立毛泽东思想为党的指导思想。8月15日日本宣布无条件投降，9月2日签署投降书，9月9日中国战区受降仪式在南京举行。","cause":"世界反法西斯战争胜利推进；中国军民长期抗战；苏联出兵东北、美国投下原子弹。","figures":["毛泽东","蒋介石","冈村宁次"],"points":["近代以来中国人民反抗外敌入侵第一次取得完全胜利的民族解放战争。","中国战场是世界反法西斯战争的东方主战场。","台湾回到祖国怀抱，洗刷了民族耻辱。"],"meaning":"为世界反法西斯战争的胜利作出了巨大贡献，为中华民族复兴奠定了基础。","summary":"日本投降，十四年抗战取得完全胜利。"},{"id":"civilwar","year":1948,"endYear":1949,"at":1948.7,"date":"1948年9月—1949年1月","title":"三大战役","stamp":"决战","kind":"war","place":"辽沈—淮海—平津—南京","marker":[117.18,34.26],"context":"1946年6月国民党进攻中原解放区，全面内战爆发；1947年刘邓大军挺进大别山，人民解放军转入战略进攻。1948年9月起，人民解放军先后发起三大战役。","cause":"国民党坚持独裁内战，丧尽民心；解放区土地改革调动了农民革命积极性。","figures":["毛泽东","林彪","粟裕","邓小平"],"points":["辽沈、淮海、平津三大战役，共歼灭和改编国民党军队150多万人。","国民党军队主力基本被消灭，为解放全中国奠定了基础。","1949年3月中共七届二中全会提出党的工作重心由乡村转向城市。"],"meaning":"为中华人民共和国的成立奠定了军事和政治基础。","summary":"三大战役定乾坤，国民党军队主力被消灭。"},{"id":"dujiang","year":1949,"endYear":1949,"at":1949.3,"date":"1949年4月21日","title":"渡江战役","stamp":"渡江","kind":"war","place":"长江·南京","marker":[118.78,32.06],"context":"三大战役后，国民党拒绝在《国内和平协定》上签字。1949年4月21日，人民解放军百万雄师横渡长江，4月23日解放南京。","cause":"国民党坚持独裁、拒绝和平，北平谈判破裂。","figures":["毛泽东","朱德","邓小平","粟裕"],"points":["1949年4月21日，渡江战役开始。","4月23日南京解放，统治中国22年的国民党政权覆灭。","随后解放上海、武汉、南昌等城市。"],"meaning":"宣告国民党反动统治的终结，为新中国成立奠定了基础。","summary":"百万雄师过大江，南京解放。"},{"id":"prc","year":1949,"endYear":1949,"at":1949.75,"date":"1949年10月1日","title":"中华人民共和国成立","stamp":"新生","kind":"founding","place":"北平·天安门","marker":[116.4,39.9],"context":"1949年9月中国人民政治协商会议第一届全体会议在北平召开，通过《共同纲领》。10月1日开国大典在天安门广场举行。","cause":"新民主主义革命取得基本胜利，人民民主统一战线空前巩固。","figures":["毛泽东","周恩来","朱德"],"points":["结束了中国半殖民地半封建社会的历史。","中国人民从此站起来了，成为国家的主人。","标志着新民主主义革命的基本胜利，中国进入由新民主主义向社会主义过渡的时期。","开国时两广、西南、海南、西藏尚未解放；1949年12月西南战役基本结束、1950年5月解放海南岛、1951年西藏和平解放，大陆领土全部解放。"],"meaning":"开辟了中国历史的新纪元，壮大了世界和平、民主和社会主义的力量。","summary":"开国大典，新民主主义革命取得基本胜利。"}];

      { from: 1947.1, to: 1949.75, owner: 'liberated', provinces: ['陕西省'] },
      { from: 1947.33, to: 1949.75, owner: 'liberated', provinces: ['内蒙古自治区'] },
      { from: 1948.4, to: 1949.75, owner: 'liberated', provinces: ['河南省'] },
      { from: 1948.8, to: 1949.75, owner: 'liberated', provinces: ['河北省', '山东省', '辽宁省', '吉林省', '黑龙江省'] },
      { from: 1949.1, to: 1949.75, owner: 'liberated', provinces: ['北京市', '天津市'] },
      { from: 1949.3, to: 1949.75, owner: 'liberated', provinces: ['江苏省', '安徽省', '山西省'] },
      { from: 1949.35, to: 1949.75, owner: 'liberated', provinces: ['浙江省', '江西省', '湖北省'] },
      { from: 1949.4, to: 1949.75, owner: 'liberated', provinces: ['上海市'] },
      { from: 1949.55, to: 1949.75, owner: 'liberated', provinces: ['湖南省', '福建省'] },
      { from: 1949.65, to: 1949.75, owner: 'liberated', provinces: ['甘肃省'] },
      { from: 1949.68, to: 1949.75, owner: 'liberated', provinces: ['青海省'] },
      { from: 1949.73, to: 1949.75, owner: 'liberated', provinces: ['宁夏回族自治区', '新疆维吾尔自治区'] },

      /* 1949.10.1 开国时尚未解放的地区，按实际解放时间并入新中国 */
      { from: 1949.75, to: 1949.79, owner: 'roc', provinces: ['广东省'] },
      { from: 1949.75, to: 1949.87, owner: 'roc', provinces: ['贵州省'] },
      { from: 1949.75, to: 1949.94, owner: 'roc', provinces: ['云南省'] },
      { from: 1949.75, to: 1949.95, owner: 'roc', provinces: ['广西壮族自治区'] },
      { from: 1949.75, to: 1949.99, owner: 'roc', provinces: ['四川省', '重庆市'] },
      { from: 1949.75, to: 1950.33, owner: 'roc', provinces: ['海南省'] },
    ];

    const LINKS = [
      { from: 'nanjingtreaty', to: 'taiping', label: '激化矛盾' },
      { from: 'jiawu', to: 'gongche', label: '民族救亡' },
      { from: 'wuxu', to: 'xinhai', label: '改良转向革命' },
      { from: 'xinhai', to: 'wusi', label: '思想启蒙' },
      { from: 'wusi', to: 'ccp', label: '准备与促进' },
      { from: '918', to: '77', label: '侵略扩大' },
      { from: 'xian', to: '77', label: '时局转换' },
      { from: 'civilwar', to: 'prc', label: '奠定基础' },
    ];

    const MIN_YEAR = 1839;
    const MAX_YEAR = 1950;
    const ERA_OLD = { from: 1839, to: 1919, label: '旧民主主义革命' };
    const ERA_NEW = { from: 1919, to: 1949.9, label: '新民主主义革命' };

    const TABS = [
      { id: 'all', label: '全部', from: 1839, to: 1950 },
      { id: 'old', label: '旧民主主义', from: 1839, to: 1919.6 },
      { id: 'new', label: '新民主主义', from: 1919, to: 1949.9 },
    ];

    const P = GEO.projection;
    const px = (lon) => (lon - P.ox) * P.kx;
    const py = (lat) => (P.oy - lat) * P.ky;

    /* --------------------------------------------------------------- helpers */

    const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));

    /** Placement year of an event on the map and the timeline (defaults to `year`). */
    function atOf(item) {
      return typeof item.at === 'number' ? item.at : item.year;
    }

    function regimeAt(year) {
      for (const regime of REGIMES) {
        if (year >= regime.from && year < regime.to) return regime.owner;
      }
      return 'qing';
    }

    function ownerAt(province, year) {
      let owner = regimeAt(year);
      for (const band of TERRITORY) {
        if (year >= band.from && year < band.to && band.provinces.indexOf(province) !== -1) {
          owner = band.owner;
        }
      }
      return owner;
    }

    function indexForYear(year) {
      let idx = 0;
      for (let i = 0; i < EVENTS.length; i += 1) {
        if (atOf(EVENTS[i]) <= year + 0.05) idx = i;
      }
      return idx;
    }

    function eraOf(year) {
      return year < 1919 ? ERA_OLD : ERA_NEW;
    }

    function fmtYear(year) {
      return String(Math.floor(year));
    }

    function tickYears(domain) {
      const span = domain[1] - domain[0];
      const step = span > 80 ? 10 : span > 40 ? 5 : span > 18 ? 2 : 1;
      const out = [];
      for (let y = Math.ceil(domain[0] / step) * step; y <= domain[1]; y += step) out.push(y);
      return out;
    }

    /* ------------------------------------------------------------- components */

    function PanelIcon(props) {
      const size = props.size || 18;
      return h('svg', {
        width: size, height: size, viewBox: '0 0 24 24', 'aria-hidden': true,
        style: { display: 'block' },
      },
      h('path', {
        d: 'M3.2 16h17.6', stroke: 'currentColor', strokeWidth: 1.6,
        strokeLinecap: 'round', fill: 'none',
      }),
      h('path', {
        d: 'M5.4 12.2c1.5-3.4 4.3-5.2 7.7-5.2 2.5 0 4.8 1 6.3 2.7',
        stroke: 'currentColor', strokeWidth: 1.4, strokeLinecap: 'round',
        fill: 'none', opacity: 0.75,
      }),
      h('circle', { cx: 7.2, cy: 16, r: 1.2, fill: 'currentColor' }),
      h('circle', { cx: 16.8, cy: 16, r: 1.2, fill: 'currentColor' }),
      h('path', { d: 'M12 13.7l2.1 2.1-2.1 2.1-2.1-2.1z', fill: 'currentColor' }));
    }

    function Toggle(props) {
      return h('button', {
        type: 'button',
        className: 'mh-btn mh-toggle' + (props.on ? ' mh-btn-on' : ''),
        'aria-pressed': props.on ? 'true' : 'false',
        title: props.title || props.children,
        onClick: props.onClick,
      }, props.children);
    }

    function InfoPanel(props) {
      const event = props.event;
      const kind = KINDS[event.kind] || KINDS.war;
      return h('div', { className: 'mh-left mh-panel' },
        h('div', { className: 'mh-panel-head', style: { borderColor: kind.color } },
          h('div', { className: 'mh-eyebrow' },
            h('span', { className: 'mh-eyebrow-dot', style: { background: kind.color } }),
            kind.label,
            event.stamp ? h('span', { className: 'mh-stamp' }, event.stamp) : null),
          h('h2', { className: 'mh-title' }, event.title),
          h('div', { className: 'mh-meta' }, event.date),
          h('div', { className: 'mh-meta mh-meta-dim' }, event.place)),

        h('div', { className: 'mh-sec' },
          h('h3', null, '历史背景'),
          h('p', null, event.context)),

        h('div', { className: 'mh-sec' },
          h('h3', null, '根本矛盾 · 起因'),
          h('p', null, event.cause)),

        h('div', { className: 'mh-sec' },
          h('h3', null, '主要人物'),
          h('div', { className: 'mh-chips' },
            event.figures.map((name) => h('span', { key: name, className: 'mh-chip' }, name)))),

        h('div', { className: 'mh-sec' },
          h('h3', null, '考点'),
          h('ul', { className: 'mh-points' },
            event.points.map((point, i) => h('li', { key: i }, point)))),

        h('div', { className: 'mh-sec' },
          h('h3', null, '历史意义'),
          h('p', { className: 'mh-meaning' }, event.meaning)));
    }

    function Callout(props) {
      const { x, y, event, scale, compact } = props;
      const k = scale > 0.15 ? scale : 0.6;
      const W = compact ? 224 : 286;
      const H = compact ? 104 : 116;
      const cardW = W / k;
      const cardH = H / k;
      let cx = x + 54 / k;
      let cy = y - 146 / k;
      if (cx + cardW > 992) cx = x - 54 / k - cardW;
      if (cx < 8) cx = 8;
      if (cy < 10) cy = y + 54 / k;
      if (cy + cardH > 712) cy = 712 - cardH;
      const cornerX = cx > x ? cx : cx + cardW;
      const cornerY = cy > y ? cy : cy + cardH;
      return h('g', { className: 'mh-callout-layer' },
        h('path', {
          d: 'M' + x + ' ' + y + ' L' + cornerX + ' ' + cornerY,
          stroke: 'rgba(214,183,124,.55)', strokeWidth: 1, strokeDasharray: '4 5', fill: 'none',
        }),
        h('circle', { cx: cornerX, cy: cornerY, r: 2.4, fill: 'rgba(214,183,124,.8)' }),
        h('g', { transform: 'translate(' + cx + ' ' + cy + ') scale(' + (1 / k) + ')' },
          h('foreignObject', { x: 0, y: 0, width: W, height: H },
            h('div', { className: 'mh-callout' },
              h('div', { className: 'mh-callout-tag' }, '批注 · ' + (event.stamp || '事件')),
              h('div', { className: 'mh-callout-title' }, event.title),
              h('div', { className: 'mh-callout-sub' }, event.date),
              h('div', { className: 'mh-callout-sub mh-callout-line' }, event.summary)))));
    }

    function MapStage(props) {
      const { year, event, showBorders, showFactions, showLinks, onSelect, compact } = props;
      const bucket = Math.round(year * 20) / 20;

      const fills = useMemo(() => {
        const map = new Map();
        for (const province of GEO.provinces) {
          map.set(province.name, ownerAt(province.name, bucket));
        }
        return map;
      }, [bucket]);

      const legendOwners = useMemo(() => {
        const seen = [];
        for (const province of GEO.provinces) {
          const owner = fills.get(province.name);
          if (seen.indexOf(owner) === -1) seen.push(owner);
        }
        return seen;
      }, [fills]);

      const ownerSummary = useMemo(() => {
        const counts = new Map();
        for (const province of GEO.provinces) {
          const owner = fills.get(province.name);
          counts.set(owner, (counts.get(owner) || 0) + 1);
        }
        const ranked = Array.from(counts.entries()).sort((a, b) => b[1] - a[1]);
        const labels = ranked.slice(0, 3).map(([owner]) => (OWNERS[owner] || OWNERS.qing).label);
        return labels.join(' / ') + (ranked.length > 3 ? ' +' + (ranked.length - 3) : '');
      }, [fills]);

      const markers = useMemo(() => {
        const groups = new Map();
        for (const item of EVENTS) {
          const key = item.marker[0] + ',' + item.marker[1];
          if (!groups.has(key)) groups.set(key, []);
          groups.get(key).push(item);
        }
        const out = [];
        for (const list of groups.values()) {
          list.forEach((item, i) => {
            let dx = 0;
            let dy = 0;
            if (list.length > 1) {
              const angle = (Math.PI * 2 * i) / list.length - Math.PI / 2;
              const radius = list.length > 4 ? 15 : 10;
              dx = Math.cos(angle) * radius;
              dy = Math.sin(angle) * radius;
            }
            out.push({
              item,
              x: px(item.marker[0]) + dx,
              y: py(item.marker[1]) + dy,
            });
          });
        }
        return out;
      }, []);

      const byId = useMemo(() => {
        const map = new Map();
        for (const marker of markers) map.set(marker.item.id, marker);
        return map;
      }, [markers]);

      const links = useMemo(() => {
        if (!showLinks) return [];
        const out = [];
        for (const link of LINKS) {
          const a = byId.get(link.from);
          const b = byId.get(link.to);
          if (!a || !b) continue;
          const mx = (a.x + b.x) / 2;
          const my = (a.y + b.y) / 2 - 70;
          out.push({ key: link.from + '-' + link.to, d: 'M' + a.x + ' ' + a.y + ' Q' + mx + ' ' + my + ' ' + b.x + ' ' + b.y, label: link.label, lx: mx, ly: my - 4 });
        }
        return out;
      }, [byId, showLinks]);

      const selected = byId.get(event.id);

      /* wheel zoom towards the cursor + drag to pan */
      const svgRef = useRef(null);
      const [view, setView] = useState({ k: 1, x: 0, y: 0 });
      const viewRef = useRef(view);
      const dragRef = useRef(null);
      const movedRef = useRef(false);

      useEffect(() => {
        viewRef.current = view;
      }, [view]);

      /* measure viewBox → screen scale so the callout keeps a constant pixel size */
      const [pxScale, setPxScale] = useState(0.6);
      useEffect(() => {
        const svg = svgRef.current;
        if (!svg) return undefined;
        const sync = () => {
          const ctm = svg.getScreenCTM();
          if (ctm && ctm.a > 0) setPxScale(ctm.a);
        };
        sync();
        const observer = new ResizeObserver(sync);
        observer.observe(svg);
        window.addEventListener('resize', sync);
        return () => {
          observer.disconnect();
          window.removeEventListener('resize', sync);
        };
      }, []);

      const clampView = (next) => {
        const k = clamp(next.k, 1, 6);
        return {
          k,
          x: clamp(next.x, 1000 - 1000 * k, 0),
          y: clamp(next.y, 720 - 720 * k, 0),
        };
      };

      const pointOf = (clientX, clientY) => {
        const svg = svgRef.current;
        if (!svg) return null;
        const ctm = svg.getScreenCTM();
        if (!ctm) return null;
        const point = svg.createSVGPoint();
        point.x = clientX;
        point.y = clientY;
        const mapped = point.matrixTransform(ctm.inverse());
        return { x: mapped.x, y: mapped.y };
      };

      useEffect(() => {
        const svg = svgRef.current;
        if (!svg) return undefined;
        const onWheel = (e) => {
          e.preventDefault();
          const at = pointOf(e.clientX, e.clientY);
          if (!at) return;
          const current = viewRef.current;
          const factor = Math.exp(-e.deltaY * 0.0016);
          const k = clamp(current.k * factor, 1, 6);
          if (Math.abs(k - current.k) < 0.0005) return;
          const next = clampView({
            k,
            x: at.x - (at.x - current.x) * (k / current.k),
            y: at.y - (at.y - current.y) * (k / current.k),
          });
          viewRef.current = next;
          setView(next);
        };
        svg.addEventListener('wheel', onWheel, { passive: false });
        return () => svg.removeEventListener('wheel', onWheel);
      }, []);

      /* touch: pinch zoom, one-finger pan, double-tap toggle */
      const pointersRef = useRef(new Map());
      const pinchRef = useRef(null);
      const lastTapRef = useRef(0);

      const touchPoints = () => Array.from(pointersRef.current.values());

      const onPointerDown = (e) => {
        const svg = svgRef.current;
        if (!svg) return;
        pointersRef.current.set(e.pointerId, { x: e.clientX, y: e.clientY });
        if (pointersRef.current.size === 2) {
          const points = touchPoints();
          const dist = Math.hypot(points[0].x - points[1].x, points[0].y - points[1].y);
          const anchor = pointOf((points[0].x + points[1].x) / 2, (points[0].y + points[1].y) / 2);
          if (anchor && dist > 0) {
            pinchRef.current = { dist, k: viewRef.current.k, anchor };
            dragRef.current = null;
            movedRef.current = true;
            svg.setPointerCapture(e.pointerId);
          }
          return;
        }
        if (e.button !== undefined && e.button !== 0) return;
        const at = pointOf(e.clientX, e.clientY);
        if (!at) return;
        dragRef.current = { x: at.x, y: at.y, tx: viewRef.current.x, ty: viewRef.current.y, id: e.pointerId };
        movedRef.current = false;
        svg.setPointerCapture(e.pointerId);
      };

      const onPointerMove = (e) => {
        if (pointersRef.current.has(e.pointerId)) {
          pointersRef.current.set(e.pointerId, { x: e.clientX, y: e.clientY });
        }
        const pinch = pinchRef.current;
        if (pinch && pointersRef.current.size >= 2) {
          const points = touchPoints();
          const dist = Math.hypot(points[0].x - points[1].x, points[0].y - points[1].y);
          if (dist <= 0 || pinch.dist <= 0) return;
          const mid = pointOf((points[0].x + points[1].x) / 2, (points[0].y + points[1].y) / 2);
          if (!mid) return;
          const k = clamp(pinch.k * (dist / pinch.dist), 1, 6);
          const next = clampView({ k, x: mid.x - pinch.anchor.x * k, y: mid.y - pinch.anchor.y * k });
          viewRef.current = next;
          setView(next);
          return;
        }
        const drag = dragRef.current;
        if (!drag || drag.id !== e.pointerId) return;
        const at = pointOf(e.clientX, e.clientY);
        if (!at) return;
        const dx = at.x - drag.x;
        const dy = at.y - drag.y;
        if (Math.abs(dx) + Math.abs(dy) > 2) movedRef.current = true;
        const next = clampView({ k: viewRef.current.k, x: drag.tx + dx, y: drag.ty + dy });
        viewRef.current = next;
        setView(next);
      };

      const onPointerUp = (e) => {
        pointersRef.current.delete(e.pointerId);
        const target = e.currentTarget;
        if (target.hasPointerCapture && target.hasPointerCapture(e.pointerId)) {
          target.releasePointerCapture(e.pointerId);
        }
        if (pinchRef.current && pointersRef.current.size < 2) {
          pinchRef.current = null;
          return;
        }
        const drag = dragRef.current;
        if (!drag || drag.id !== e.pointerId) return;
        dragRef.current = null;
        if (movedRef.current || e.pointerType === 'mouse') return;
        const now = Date.now();
        if (now - lastTapRef.current < 320) {
          lastTapRef.current = 0;
          const at = pointOf(e.clientX, e.clientY);
          if (!at) return;
          const k = viewRef.current.k > 1.2 ? 1 : 2.4;
          const next = clampView({ k, x: at.x - at.x * k, y: at.y - at.y * k });
          viewRef.current = next;
          setView(next);
        } else {
          lastTapRef.current = now;
        }
      };

      const resetView = () => {
        const next = { k: 1, x: 0, y: 0 };
        viewRef.current = next;
        setView(next);
      };

      return h('div', {
        className: 'mh-map',
        'data-zoomed': view.k > 1 ? 'true' : undefined,
      },
        h('svg', {
          ref: svgRef,
          className: 'mh-svg', viewBox: '0 0 1000 720',
          preserveAspectRatio: 'xMidYMid meet', role: 'img',
          'aria-label': '中国近代史势力示意图',
          onPointerDown, onPointerMove, onPointerUp, onPointerCancel: onPointerUp,
        },
        h('defs', null,
          h('radialGradient', { id: 'mh-map-glow', cx: '64%', cy: '30%', r: '75%' },
            h('stop', { offset: '0%', stopColor: 'rgba(84,116,168,.30)' }),
            h('stop', { offset: '60%', stopColor: 'rgba(28,42,64,.16)' }),
            h('stop', { offset: '100%', stopColor: 'rgba(8,12,18,0)' }))),
        h('rect', { x: 0, y: 0, width: 1000, height: 720, fill: 'url(#mh-map-glow)' }),

        h('g', {
          className: 'mh-world',
          transform: 'translate(' + view.x + ' ' + view.y + ') scale(' + view.k + ')',
        },
        h('g', { className: 'mh-provinces' },
          GEO.provinces.map((province) => {
            const owner = fills.get(province.name) || 'qing';
            const color = OWNERS[owner] || OWNERS.qing;
            return h('path', {
              key: province.name,
              d: province.d,
              fill: showFactions ? color.color : '#6f6146',
              fillOpacity: showFactions ? (owner === 'qing' ? 0.5 : 0.72) : 0.22,
              stroke: showBorders ? 'rgba(238,222,186,.34)' : 'transparent',
              strokeWidth: showBorders ? 0.8 : 0,
            });
          })),

        h('g', { className: 'mh-links' },
          links.map((link) => h('g', { key: link.key },
            h('path', {
              d: link.d, fill: 'none', stroke: 'rgba(214,183,124,.5)',
              strokeWidth: 1.1, strokeDasharray: '5 6',
            }),
            h('text', {
              x: link.lx, y: link.ly, textAnchor: 'middle',
              fill: 'rgba(214,190,146,.72)', fontSize: 14, letterSpacing: 1,
            }, link.label)))),

        h('g', { className: 'mh-markers' },
          markers.map((marker) => {
            const isSelected = marker.item.id === event.id;
            const kind = KINDS[marker.item.kind] || KINDS.war;
            const gap = Math.abs(atOf(marker.item) - year);
            const near = gap <= 12;
            const far = gap > 30;
            return h('g', {
              key: marker.item.id,
              transform: 'translate(' + marker.x + ' ' + marker.y + ')',
              className: 'mh-marker' + (isSelected ? ' mh-marker-on' : ''),
              role: 'button',
              tabIndex: 0,
              'aria-label': marker.item.year + ' ' + marker.item.title,
              onClick: () => {
                if (movedRef.current) return;
                onSelect(marker.item.id);
              },
              onKeyDown: (e) => {
                if (e.key === 'Enter' || e.key === ' ') {
                  e.preventDefault();
                  onSelect(marker.item.id);
                }
              },
            },
            isSelected
              ? h('circle', { r: 15.5, fill: 'none', stroke: kind.color, strokeWidth: 1.2, className: 'mh-pulse' })
              : null,
            h('path', {
              d: 'M0 -7 L7 0 L0 7 L-7 0 Z',
              transform: isSelected ? 'scale(1.5)' : 'scale(1)',
              fill: isSelected ? kind.color : 'rgba(12,17,24,.85)',
              stroke: kind.color,
              strokeWidth: isSelected ? 1.6 : 1,
              opacity: isSelected ? 1 : near ? 0.9 : far ? 0.24 : 0.5,
            }),
            isSelected || near
              ? h('text', {
                x: 0, y: -16, textAnchor: 'middle', fontSize: 14,
                fill: isSelected ? '#f0e6cf' : 'rgba(222,210,182,.55)',
              }, String(marker.item.year))
              : null);
          })),

        ),

        selected
          ? h(Callout, {
            key: 'callout',
            x: selected.x * view.k + view.x,
            y: selected.y * view.k + view.y,
            event,
            scale: pxScale,
            compact,
          })
          : null),

        h('div', { className: 'mh-map-tag' },
          h('span', { className: 'mh-map-tag-k' }, '势力图 · ' + ownerSummary),
          h('span', { className: 'mh-map-tag-v' }, fmtYear(year) + ' 年')),
        view.k > 1
          ? h('button', {
            type: 'button',
            className: 'mh-map-reset',
            onClick: resetView,
          }, '复位视图 ' + view.k.toFixed(1) + '×')
          : null,
        h('div', { className: 'mh-map-hint' }, '滚轮缩放 · 拖动平移'),
        h('div', { className: 'mh-map-legend' },
          legendOwners.map((owner) => {
            const info = OWNERS[owner] || OWNERS.qing;
            return h('span', { key: owner, className: 'mh-map-legend-item' },
              h('i', { style: { background: info.color } }), info.label);
          })));
    }

    function IndexPanel(props) {
      const { events, selectedId, onSelect, year, onZoom, onReset } = props;
      const groups = useMemo(() => {
        const old = [];
        const neo = [];
        for (const item of events) (item.year < 1919 ? old : neo).push(item);
        return [
          { key: 'old', title: '旧民主主义革命', range: '1840 — 1919', items: old },
          { key: 'new', title: '新民主主义革命', range: '1919 — 1949', items: neo },
        ];
      }, [events]);

      return h('div', { className: 'mh-right' },
        h('div', { className: 'mh-card' },
          h('div', { className: 'mh-card-head' },
            h('span', { className: 'mh-card-k' }, '事件定位'),
            h('span', { className: 'mh-card-v' }, '当前 ' + fmtYear(year))),
          h('div', { className: 'mh-card-date' }, props.event.date),
          h('div', { className: 'mh-card-title' }, props.event.title),
          h('div', { className: 'mh-card-body' }, props.event.summary)),

        h('div', { className: 'mh-zoom' },
          h('button', { type: 'button', className: 'mh-zoom-btn', title: '放大时间轴', onClick: () => onZoom(0.6) }, '+'),
          h('button', { type: 'button', className: 'mh-zoom-btn', title: '缩小时间轴', onClick: () => onZoom(1.7) }, '−'),
          h('button', { type: 'button', className: 'mh-zoom-btn mh-zoom-wide', title: '复位时间轴', onClick: onReset }, '复位')),

        h('div', { className: 'mh-index' },
          groups.map((group) => h('div', { key: group.key, className: 'mh-index-group' },
            h('div', { className: 'mh-index-head' },
              h('span', null, group.title),
              h('em', null, group.range)),
            group.items.map((item) => {
              const kind = KINDS[item.kind] || KINDS.war;
              const on = item.id === selectedId;
              return h('button', {
                key: item.id,
                type: 'button',
                className: 'mh-index-row' + (on ? ' mh-index-row-on' : ''),
                'aria-current': on ? 'page' : undefined,
                onClick: () => onSelect(item.id),
              },
              h('i', { className: 'mh-index-mark', style: { background: kind.color } }),
              h('span', { className: 'mh-index-year' }, String(item.year)),
              h('span', { className: 'mh-index-name' }, item.title));
            })))),

        h('div', { className: 'mh-legend' },
          h('div', { className: 'mh-legend-title' }, '关联图例'),
          h('div', { className: 'mh-legend-row' }, h('i', { className: 'mh-dash' }), '事件之间的因果 / 推动关系'),
          h('div', { className: 'mh-legend-row' }, h('i', { className: 'mh-dotmark' }), '◇ 点击地图节点或时间轴圆点跳转'))); 
    }

    function TimeRail(props) {
      const { domain, year, events, selectedId, onScrub, onSelect, trackRef } = props;
      const span = domain[1] - domain[0];
      const ratio = (value) => ((value - domain[0]) / span) * 100;
      const ticks = tickYears(domain);

      const inDomain = events.filter((item) => atOf(item) >= domain[0] - 0.4 && atOf(item) <= domain[1] + 0.4);

      /* place dots on four lanes so events inside the same year stay clickable */
      const LANE_TOPS = [20, 34, 48, 62];
      const MIN_GAP = 1.2;
      const lanesAt = LANE_TOPS.map(() => -Infinity);
      const dots = inDomain.map((item) => {
        const left = ratio(atOf(item));
        let lane = lanesAt.findIndex((last) => left - last >= MIN_GAP);
        if (lane === -1) {
          lane = 0;
          for (let i = 1; i < lanesAt.length; i += 1) {
            if (lanesAt[i] < lanesAt[lane]) lane = i;
          }
        }
        lanesAt[lane] = left;
        return { item, left, lane };
      });

      const eraLeft = clamp(ratio(ERA_OLD.from), 0, 100);
      const eraRight = clamp(ratio(ERA_OLD.to), 0, 100);
      const newLeft = clamp(ratio(ERA_NEW.from), 0, 100);
      const newRight = clamp(ratio(ERA_NEW.to), 0, 100);

      const handlePointerDown = (e) => {
        if (e.button !== 0) return;
        const el = e.currentTarget;
        el.setPointerCapture(e.pointerId);
        e.preventDefault();
        onScrub(e.clientX);
      };
      const handlePointerMove = (e) => {
        if (!e.currentTarget.hasPointerCapture(e.pointerId)) return;
        onScrub(e.clientX);
      };

      return h('div', { className: 'mh-rail' },
        h('div', { className: 'mh-rail-top' },
          h('span', { className: 'mh-rail-caption' }, '时间轴 · 向右为历史推进'),
          h('span', { className: 'mh-rail-hint' }, '空格 播放/暂停 · ← → 微调 · 拖动轴条定位'),

        ),
        h('div', {
          className: 'mh-track',
          ref: trackRef,
          onPointerDown: handlePointerDown,
          onPointerMove: handlePointerMove,
          role: 'slider',
          'aria-label': '近代史时间轴',
          'aria-valuemin': Math.floor(domain[0]),
          'aria-valuemax': Math.ceil(domain[1]),
          'aria-valuenow': Math.floor(year),
          tabIndex: 0,
        },
        eraRight > eraLeft
          ? h('div', { className: 'mh-era-band', style: { left: eraLeft + '%', width: (eraRight - eraLeft) + '%' } },
            h('span', { className: 'mh-era-label' }, '旧民主主义革命'))
          : null,
        newRight > newLeft
          ? h('div', { className: 'mh-era-band mh-era-band-new', style: { left: newLeft + '%', width: (newRight - newLeft) + '%' } },
            h('span', { className: 'mh-era-label' }, '新民主主义革命'))
          : null,

        h('div', { className: 'mh-axis' }),

        ticks.map((tick) => {
          const left = ratio(tick);
          if (left < -1 || left > 101) return null;
          return h('div', { key: tick, className: 'mh-tick', style: { left: left + '%' } },
            h('i', null),
            h('span', null, String(tick)));
        }),

        dots.map(({ item, left, lane }) => {
          const on = item.id === selectedId;
          const kind = KINDS[item.kind] || KINDS.war;
          return h('button', {
            key: item.id,
            type: 'button',
            className: 'mh-dot' + (on ? ' mh-dot-on' : ''),
            style: { left: left + '%', top: LANE_TOPS[lane] + 'px' },
            title: item.year + ' · ' + item.title,
            'aria-label': item.year + ' ' + item.title,
            onPointerDown: (e) => { e.stopPropagation(); },
            onClick: (e) => { e.stopPropagation(); onSelect(item.id); },
          },
          h('i', { style: { background: on ? kind.color : 'rgba(214,183,124,.55)' } }));
        }),

        h('div', { className: 'mh-playhead', style: { left: clamp(ratio(year), 0, 100) + '%' } },
          h('div', { className: 'mh-playhead-bubble' }, fmtYear(year)),
          h('i', { className: 'mh-playhead-pin' }))));
    }

    /* ------------------------------------------------------------------ panel */

    function Panel(props) {
      const rootRef = useRef(null);
      const trackRef = useRef(null);

      const [year, setYear] = useState(1840);
      const [selectedId, setSelectedId] = useState(EVENTS[0].id);
      const [playing, setPlaying] = useState(false);
      const [speed, setSpeed] = useState(1);
      const [domain, setDomain] = useState([MIN_YEAR, MAX_YEAR]);
      const [tab, setTab] = useState('all');
      const [showFactions, setShowFactions] = useState(true);
      const [showBorders, setShowBorders] = useState(true);
      const [showLinks, setShowLinks] = useState(true);
      const [autoFollow, setAutoFollow] = useState(true);

      /* narrow (phone) layout: left/right columns collapse into a bottom sheet */
      const [narrow, setNarrow] = useState(false);
      const [sheetOpen, setSheetOpen] = useState(false);
      const [sheetTab, setSheetTab] = useState('event');

      useEffect(() => {
        const query = window.matchMedia('(max-width: 719px)');
        const sync = () => setNarrow(query.matches);
        sync();
        if (query.addEventListener) query.addEventListener('change', sync);
        else query.addListener(sync);
        return () => {
          if (query.removeEventListener) query.removeEventListener('change', sync);
          else query.removeListener(sync);
        };
      }, []);

      const byId = useMemo(() => {
        const map = new Map();
        for (const item of EVENTS) map.set(item.id, item);
        return map;
      }, []);

      const event = byId.get(selectedId) || EVENTS[0];

      const select = useCallback((id) => {
        const next = byId.get(id);
        if (!next) return;
        const placement = atOf(next);
        setSelectedId(id);
        setYear(placement);
        setDomain((current) => {
          if (placement >= current[0] && placement <= current[1]) return current;
          const span = clamp(current[1] - current[0], 12, 44);
          const start = clamp(placement - span / 2, MIN_YEAR, MAX_YEAR - span);
          return [start, start + span];
        });
      }, [byId]);

      const scrubTo = useCallback((clientX) => {
        const el = trackRef.current;
        if (!el) return;
        const rect = el.getBoundingClientRect();
        if (rect.width <= 0) return;
        const ratio = clamp((clientX - rect.left) / rect.width, 0, 1);
        const next = domain[0] + ratio * (domain[1] - domain[0]);
        setYear(next);
        setPlaying(false);
        setSelectedId(EVENTS[indexForYear(next)].id);
      }, [domain]);

      /* playback */
      const yearRef = useRef(year);
      useEffect(() => {
        yearRef.current = year;
      }, [year]);

      useEffect(() => {
        if (!playing) return undefined;
        let frame = 0;
        let last = 0;
        const step = (now) => {
          if (!last) last = now;
          const dt = Math.min(120, now - last) / 1000;
          last = now;
          const next = yearRef.current + dt * 6 * speed;
          if (next >= domain[1]) {
            yearRef.current = domain[1];
            setYear(domain[1]);
            setPlaying(false);
            return;
          }
          yearRef.current = next;
          setYear(next);
          frame = requestAnimationFrame(step);
        };
        frame = requestAnimationFrame(step);
        return () => cancelAnimationFrame(frame);
      }, [playing, speed, domain]);

      /* follow the playhead while playing */
      useEffect(() => {
        if (!autoFollow) return;
        const idx = indexForYear(year);
        if (EVENTS[idx] && EVENTS[idx].id !== selectedId) setSelectedId(EVENTS[idx].id);
      }, [year, autoFollow, selectedId]);

      const zoomBy = useCallback((factor) => {
        setDomain((current) => {
          let span = (current[1] - current[0]) * factor;
          span = clamp(span, 8, MAX_YEAR - MIN_YEAR);
          const center = clamp(year, current[0], current[1]);
          let start = center - span / 2;
          let end = start + span;
          if (start < MIN_YEAR) { start = MIN_YEAR; end = start + span; }
          if (end > MAX_YEAR) { end = MAX_YEAR; start = end - span; }
          return [start, end];
        });
      }, [year]);

      const resetDomain = useCallback(() => {
        setDomain([MIN_YEAR, MAX_YEAR]);
      }, []);

      /* fullscreen: native Fullscreen API, with an in-app overlay fallback */
      const [nativeFull, setNativeFull] = useState(false);
      const [immersive, setImmersive] = useState(false);

      useEffect(() => {
        const sync = () => setNativeFull(Boolean(document.fullscreenElement));
        document.addEventListener('fullscreenchange', sync);
        return () => document.removeEventListener('fullscreenchange', sync);
      }, []);

      const toggleFullscreen = useCallback(() => {
        const el = rootRef.current;
        if (!el) return;
        if (document.fullscreenElement) {
          const exit = document.exitFullscreen();
          if (exit && typeof exit.catch === 'function') exit.catch(() => {});
          return;
        }
        const request = el.requestFullscreen || el.webkitRequestFullscreen;
        if (typeof request !== 'function') {
          setImmersive((value) => !value);
          return;
        }
        try {
          const result = request.call(el);
          if (result && typeof result.catch === 'function') {
            result.catch(() => setImmersive((value) => !value));
          }
        } catch (err) {
          setImmersive((value) => !value);
        }
      }, []);

      const isFullscreen = nativeFull || immersive;

      useEffect(() => {
        if (!immersive) return undefined;
        const onKey = (e) => {
          if (e.key === 'Escape') setImmersive(false);
        };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, [immersive]);

      const applyTab = useCallback((nextTab) => {
        setTab(nextTab);
        const found = TABS.find((item) => item.id === nextTab) || TABS[0];
        setDomain([found.from, found.to]);
        setYear(clamp(year, found.from, found.to));
      }, [year]);

      /* keyboard shortcuts, scoped to this panel */
      useEffect(() => {
        const onKeyDown = (e) => {
          const root = rootRef.current;
          if (!root || !root.contains(e.target)) return;
          if (e.key === ' ') {
            e.preventDefault();
            setPlaying((value) => !value);
          } else if (e.key === 'ArrowRight') {
            e.preventDefault();
            setPlaying(false);
            setYear((value) => Math.min(domain[1], value + (e.shiftKey ? 10 : 1)));
          } else if (e.key === 'ArrowLeft') {
            e.preventDefault();
            setPlaying(false);
            setYear((value) => Math.max(domain[0], value - (e.shiftKey ? 10 : 1)));
          } else if (e.key === 'f' || e.key === 'F') {
            e.preventDefault();
            toggleFullscreen();
          }
        };
        window.addEventListener('keydown', onKeyDown);
        return () => window.removeEventListener('keydown', onKeyDown);
      }, [domain, toggleFullscreen]);

      const era = eraOf(year);
      const yearInt = Math.floor(year);
      const periodLabel = era === ERA_OLD ? '上编 · 旧民主主义革命' : '中编 · 新民主主义革命';

      return h('div', {
        className: 'mh-root' + (immersive ? ' mh-immersive' : ''),
        ref: rootRef,
        tabIndex: -1,
      },
        h('style', { key: 'mh-style' }, MH_CSS),

        h('div', { className: 'mh-top' },
          h('div', { className: 'mh-brand' },
            h('div', { className: 'mh-year' }, String(yearInt)),
            h('div', { className: 'mh-brand-text' },
              h('div', { className: 'mh-brand-title' },
                '史纲 · 中国近代史时间轴',
                h('span', { className: 'mh-badge' }, era.label)),
              h('div', { className: 'mh-brand-sub' }, periodLabel + ' · ' + fmtYear(year) + ' 年'))),

          h('div', { className: 'mh-controls' },
            h('button', {
              type: 'button',
              className: 'mh-btn mh-btn-play' + (playing ? ' mh-btn-on' : ''),
              'aria-pressed': playing ? 'true' : 'false',
              onClick: () => setPlaying((value) => !value),
            }, playing ? '暂停' : '播放'),
            h('select', {
              className: 'mh-select',
              value: String(speed),
              'aria-label': '播放速度',
              onChange: (e) => setSpeed(Number(e.target.value)),
            },
            [0.5, 1, 2, 4].map((value) => h('option', { key: value, value: String(value) }, value + '×'))),
            h(Toggle, { on: showFactions, onClick: () => setShowFactions((v) => !v), title: '按年份显示势力范围' }, '势力图'),
            h(Toggle, { on: showBorders, onClick: () => setShowBorders((v) => !v), title: '显示省界' }, '省界'),
            h(Toggle, { on: showLinks, onClick: () => setShowLinks((v) => !v), title: '显示事件因果连线' }, '关联'),
            h(Toggle, { on: autoFollow, onClick: () => setAutoFollow((v) => !v), title: '播放时自动跟随事件' }, '跟随'),
            h('button', {
              type: 'button',
              className: 'mh-btn' + (isFullscreen ? ' mh-btn-on' : ''),
              'aria-pressed': isFullscreen ? 'true' : 'false',
              title: isFullscreen ? '退出全屏（Esc）' : '全屏查看（F）',
              onClick: toggleFullscreen,
            }, isFullscreen ? '退出全屏' : '全屏')),

          h('div', { className: 'mh-tabs' },
            TABS.map((item) => h('button', {
              key: item.id,
              type: 'button',
              className: 'mh-tab' + (tab === item.id ? ' mh-tab-on' : ''),
              'aria-pressed': tab === item.id ? 'true' : 'false',
              onClick: () => applyTab(item.id),
            }, item.label)))),

        h('div', { className: 'mh-body' },
          narrow ? null : h(InfoPanel, { event }),
          h(MapStage, {
            year, event, showBorders, showFactions, showLinks, compact: narrow,
            onSelect: (id) => { setPlaying(false); select(id); },
          }),
          narrow ? null : h(IndexPanel, {
            event, events: EVENTS, selectedId, year,
            onSelect: (id) => { setPlaying(false); select(id); },
            onZoom: zoomBy, onReset: resetDomain,
          })),

        narrow
          ? h('div', { className: 'mh-sheet' + (sheetOpen ? ' mh-sheet-open' : '') },
            h('div', { className: 'mh-sheet-head' },
              h('button', {
                type: 'button',
                className: 'mh-sheet-handle',
                'aria-expanded': sheetOpen ? 'true' : 'false',
                onClick: () => setSheetOpen((value) => !value),
              },
              h('i', { className: 'mh-sheet-grip' }),
              h('span', { className: 'mh-sheet-title' }, event.title),
              h('span', { className: 'mh-sheet-caret' }, sheetOpen ? '收起' : '详情')),
              h('div', { className: 'mh-sheet-tabs' },
                h('button', {
                  type: 'button',
                  className: 'mh-tab' + (sheetTab === 'event' ? ' mh-tab-on' : ''),
                  onClick: () => { setSheetTab('event'); setSheetOpen(true); },
                }, '事件'),
                h('button', {
                  type: 'button',
                  className: 'mh-tab' + (sheetTab === 'index' ? ' mh-tab-on' : ''),
                  onClick: () => { setSheetTab('index'); setSheetOpen(true); },
                }, '索引'))),
            h('div', { className: 'mh-sheet-body' },
              sheetTab === 'event'
                ? h(InfoPanel, { event })
                : h(IndexPanel, {
                  event, events: EVENTS, selectedId, year,
                  onSelect: (id) => { setPlaying(false); select(id); setSheetOpen(false); },
                  onZoom: zoomBy, onReset: resetDomain,
                })))
          : null,

        h(TimeRail, {
          domain, year, events: EVENTS, selectedId,
          trackRef,
          onScrub: scrubTo,
          onSelect: (id) => { setPlaying(false); select(id); },
        }),
      );
    }

    /* -------------------------------------------------------------------- css */

    const MH_CSS = `.mh-root {
  --mh-bg: #0a0f16;
  --mh-panel: rgba(16, 23, 33, 0.86);
  --mh-line: rgba(198, 164, 105, 0.2);
  --mh-line-strong: rgba(214, 183, 124, 0.5);
  --mh-gold: #d9bb7d;
  --mh-gold-soft: #a98b55;
  --mh-text: #e9e3d6;
  --mh-text-dim: #b9b1a1;
  position: relative;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  flex: 1 1 auto;
  height: 100%;
  min-height: 520px;
  overflow: hidden;
  color: var(--mh-text);
  background:
    radial-gradient(1100px 520px at 62% 12%, rgba(60, 88, 136, 0.22), transparent 72%),
    linear-gradient(180deg, #0b1119 0%, #080c12 68%);
  font-family: "Noto Sans SC", "Source Han Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
  font-size: 14.5px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

}

.mh-tab-on {
  color: #f6ecd5;
  border-color: var(--mh-line-strong);
  background: rgba(214, 183, 124, 0.08);
}

/* ------------------------------------------------------------------ body */

.mh-body {
  display: flex;
  gap: 12px;
  flex: 1 1 auto;
  min-height: 0;
  padding: 12px 16px 2px;
}

.mh-body > * {
  min-height: 0;
}

/* ------------------------------------------------------------ info panel */

.mh-left {
  flex: 0 0 320px;
  width: 320px;
  overflow-y: auto;
  overflow-x: hidden;
  border: 1px solid var(--mh-line);
  border-radius: 12px;
  background: linear-gradient(168deg, rgba(24, 33, 46, 0.92), rgba(12, 17, 24, 0.94));
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.03);
}

.mh-panel-head {
  padding: 14px 16px 12px;
  border-left: 3px solid var(--mh-gold-soft);
}

.mh-eyebrow {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 12px;
  letter-spacing: 2px;
  color: var(--mh-gold-soft);
}

.mh-eyebrow-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  flex: 0 0 auto;
}

.mh-stamp {
  margin-left: auto;
  padding: 1px 7px;
  border: 1px solid var(--mh-line);
  border-radius: 999px;
  font-size: 10.5px;
  letter-spacing: 1px;
  color: rgba(217, 187, 125, 0.9);
}

.mh-title {
  margin: 8px 0 6px;
  font-size: 22.5px;
  font-weight: 600;
  line-height: 1.35;
  letter-spacing: 0.6px;
  color: #f4ead6;
}

.mh-meta {
  font-size: 13px;
  letter-spacing: 0.4px;
  color: var(--mh-gold);
}

.mh-meta-dim {
  margin-top: 2px;
  color: rgba(190, 180, 160, 0.66);
}

.mh-sec {
  padding: 0 16px 12px;
}

.mh-sec h3 {
  margin: 12px 0 6px;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 2.4px;
  color: var(--mh-gold-soft);
}

.mh-sec h3::before {
  content: "";
  display: inline-block;
  width: 10px;
  height: 1px;
  margin-right: 7px;
  vertical-align: middle;
  background: var(--mh-gold-soft);
}

.mh-sec p {
  margin: 0;
  font-size: 14px;
  line-height: 1.88;
  color: #d5cdbd;
  text-align: justify;
}

.mh-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.mh-chip {
  padding: 3px 10px;
  border: 1px solid var(--mh-line);
  border-radius: 999px;
  background: rgba(214, 183, 124, 0.05);
  font-size: 13px;
  color: var(--mh-gold);
}

.mh-points {
  margin: 0;
  padding: 0;
  list-style: none;
}

.mh-points li {
  position: relative;
  margin-bottom: 6px;
  padding-left: 15px;
  font-size: 14px;
  line-height: 1.8;
  color: #d5cdbd;
}

.mh-points li::before {
  content: "—";
  position: absolute;
  left: 0;
  top: 0;
  color: rgba(169, 139, 85, 0.85);
}

.mh-meaning {
  border-left: 2px solid var(--mh-line-strong);
  padding-left: 10px;
  color: #e9dfca !important;
}

/* -------------------------------------------------------------- map stage */

.mh-map {
  position: relative;
  flex: 1 1 auto;
  min-width: 0;
  overflow: hidden;
  border: 1px solid var(--mh-line);
  border-radius: 12px;
  background:
    radial-gradient(120% 95% at 58% 18%, #16233a 0%, #0b1220 52%, #06090e 100%);
}

.mh-svg {
  display: block;
  width: 100%;
  height: 100%;
  touch-action: none;
}

.mh-map[data-zoomed="true"] .mh-svg {
  cursor: grab;
}

.mh-map[data-zoomed="true"] .mh-svg:active {
  cursor: grabbing;
}

.mh-map-reset {
  position: absolute;
  right: 12px;
  bottom: 30px;
  height: 24px;
  padding: 0 10px;
  border: 1px solid var(--mh-line-strong);
  border-radius: 7px;
  background: rgba(20, 28, 38, 0.9);
  color: var(--mh-gold);
  font-family: inherit;
  font-size: 12px;
  letter-spacing: 0.5px;
  cursor: pointer;
}

.mh-map-reset:hover {
  background: rgba(214, 183, 124, 0.14);
}

.mh-map-hint {
  position: absolute;
  right: 13px;
  bottom: 10px;
  font-size: 10.5px;
  letter-spacing: 1px;
  color: rgba(190, 180, 160, 0.4);
  pointer-events: none;
}

.mh-marker {
  cursor: pointer;
  outline: none;
}

.mh-marker:hover path {
  opacity: 1;
}

.mh-marker:focus-visible path {
  stroke-width: 2.2;
}

.mh-pulse {
  transform-origin: center;
  transform-box: fill-box;
  animation: mh-pulse 2.6s ease-out infinite;
}

@keyframes mh-pulse {
  0% {
    opacity: 0.85;
    transform: scale(0.55);
  }
  70% {
    opacity: 0;
    transform: scale(1.6);
  }
  100% {
    opacity: 0;
    transform: scale(1.6);
  }
}

.mh-map-tag {
  position: absolute;
  top: 10px;
  right: 13px;
  text-align: right;
  pointer-events: none;
}

.mh-map-tag-k {
  display: block;
  font-size: 10.5px;
  letter-spacing: 2px;
  color: rgba(217, 187, 125, 0.62);
}

.mh-map-tag-v {
  display: block;
  margin-top: 2px;
  font-size: 13.5px;
  letter-spacing: 1px;
  color: rgba(240, 230, 208, 0.86);
}

.mh-map-legend {
  position: absolute;
  left: 13px;
  bottom: 11px;
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  pointer-events: none;
  font-size: 12px;
  color: rgba(222, 212, 192, 0.78);
}

.mh-map-legend-item {
  display: inline-flex;
  align-items: center;
  gap: 5px;
}

.mh-map-legend-item i {
  width: 10px;
  height: 10px;
  border-radius: 2px;
  display: inline-block;
}

.mh-callout {
  width: 100%;
  height: 100%;
  padding: 10px 12px;
  border: 1px solid rgba(214, 183, 124, 0.44);
  border-radius: 10px;
  background: rgba(13, 19, 27, 0.94);
  box-shadow: 0 10px 26px rgba(0, 0, 0, 0.46);
  overflow: hidden;
}

.mh-callout-tag {
  font-size: 10.5px;
  letter-spacing: 1.8px;
  color: #c9a35f;
}

.mh-callout-title {
  margin-top: 3px;
  font-size: 17px;
  font-weight: 600;
  color: #f2e8d3;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.mh-callout-sub {
  margin-top: 3px;
  font-size: 12px;
  letter-spacing: 0.3px;
  color: rgba(214, 205, 185, 0.72);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.mh-callout-line {
  margin-top: 4px;
  color: rgba(222, 212, 190, 0.62);
}

/* ------------------------------------------------------------- index side */

.mh-right {
  display: flex;
  flex-direction: column;
  gap: 9px;
  flex: 0 0 236px;
  width: 236px;
  min-height: 0;
}

.mh-card {
  padding: 12px 14px;
  border: 1px solid var(--mh-line);
  border-radius: 12px;
  background: linear-gradient(160deg, rgba(30, 42, 58, 0.9), rgba(13, 18, 26, 0.92));
}

.mh-card-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  font-size: 10.5px;
  letter-spacing: 1.8px;
  color: var(--mh-gold-soft);
}

.mh-card-v {
  letter-spacing: 0.5px;
  color: rgba(200, 190, 170, 0.62);
}

.mh-card-date {
  margin-top: 8px;
  font-size: 12.5px;
  letter-spacing: 0.4px;
  color: var(--mh-gold);
}

.mh-card-title {
  margin: 3px 0 5px;
  font-size: 17px;
  font-weight: 600;
  line-height: 1.4;
  color: #f2e8d3;
}

.mh-card-body {
  font-size: 13px;
  line-height: 1.72;
  color: #c6bfb0;
}

.mh-zoom {
  display: flex;
  gap: 6px;
  flex: 0 0 auto;
}

.mh-zoom-btn {
  height: 30px;
  width: 33px;
  padding: 0;
  border: 1px solid var(--mh-line);
  border-radius: 8px;
  background: rgba(20, 28, 38, 0.82);
  color: var(--mh-gold);
  font-family: inherit;
  font-size: 14.5px;
  cursor: pointer;
  transition: border-color 160ms ease, background 160ms ease;
}

.mh-zoom-btn:hover {
  border-color: var(--mh-line-strong);
  background: rgba(214, 183, 124, 0.12);
}

.mh-zoom-wide {
  flex: 1 1 auto;
  width: auto;
  font-size: 12.5px;
  letter-spacing: 1px;
}

.mh-index {
  flex: 1 1 auto;
  min-height: 70px;
  overflow-y: auto;
  padding-right: 2px;
}

.mh-index-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin: 10px 2px 5px;
  font-size: 12px;
  letter-spacing: 1.4px;
  color: var(--mh-gold-soft);
}

.mh-index-head em {
  font-style: normal;
  font-size: 10.5px;
  letter-spacing: 0;
  color: rgba(190, 180, 160, 0.5);
}

.mh-index-row {
  display: flex;
  align-items: center;
  gap: 7px;
  width: 100%;
  padding: 7px 8px;
  border: 1px solid transparent;
  border-radius: 8px;
  background: transparent;
  color: #cbc4b5;
  font-family: inherit;
  font-size: 13px;
  text-align: left;
  cursor: pointer;
  transition: background 160ms ease, color 160ms ease, border-color 160ms ease;
}

.mh-index-row:hover {
  background: rgba(214, 183, 124, 0.07);
  color: #f0e6d1;
}

.mh-index-row-on {
  background: rgba(214, 183, 124, 0.13);
  border-color: rgba(214, 183, 124, 0.36);
  color: #f6ecd5;
}

.mh-index-mark {
  flex: 0 0 auto;
  width: 5px;
  height: 5px;
  border-radius: 50%;
  opacity: 0.9;
}

.mh-index-year {
  flex: 0 0 auto;
  width: 30px;
  font-size: 11px;
  color: rgba(217, 187, 125, 0.78);
  font-variant-numeric: tabular-nums;
}

.mh-index-name {
  flex: 1 1 auto;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.mh-legend {
  flex: 0 0 auto;
  padding-top: 8px;
  border-top: 1px dashed var(--mh-line);
  font-size: 11px;
  color: rgba(200, 190, 170, 0.66);
}

.mh-legend-title {
  margin-bottom: 4px;
  letter-spacing: 1.4px;
  color: var(--mh-gold-soft);
}

.mh-legend-row {
  display: flex;
  align-items: center;
  gap: 8px;
  line-height: 1.7;
}

.mh-dash {
  display: inline-block;
  width: 15px;
  height: 0;
  border-top: 1px dashed rgba(214, 183, 124, 0.7);
}

.mh-dotmark {
  display: inline-block;
  width: 15px;
  text-align: center;
  font-style: normal;
  color: var(--mh-gold);
}

/* ------------------------------------------------------------------ rail */

.mh-rail {
  flex: 0 0 auto;
  padding: 4px 22px 8px;
  border-top: 1px solid var(--mh-line);
  background: linear-gradient(180deg, rgba(11, 16, 23, 0.4), rgba(8, 12, 18, 0.9));
}

.mh-rail-top {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  padding: 2px 0 0;
  font-size: 11px;
  letter-spacing: 1.4px;
  color: rgba(190, 180, 160, 0.6);
}

.mh-rail-caption {
  color: rgba(217, 187, 125, 0.7);
}

.mh-rail-hint {
  letter-spacing: 0.4px;
  color: rgba(170, 162, 148, 0.5);
}

.mh-track {
  position: relative;
  height: 104px;
  margin-top: 2px;
  cursor: crosshair;
  touch-action: none;
  outline: none;
}

.mh-track:focus-visible {
  box-shadow: 0 0 0 1px rgba(214, 183, 124, 0.35);
  border-radius: 8px;
}

.mh-era-band {
  position: absolute;
  top: 0;
  bottom: 6px;
  pointer-events: none;
  border-left: 1px dashed rgba(214, 183, 124, 0.22);
  background: linear-gradient(180deg, rgba(214, 183, 124, 0.06), rgba(214, 183, 124, 0));
}

.mh-era-band-new {
  border-left-color: rgba(141, 92, 179, 0.32);
  background: linear-gradient(180deg, rgba(141, 92, 179, 0.09), rgba(141, 92, 179, 0));
}

.mh-era-label {
  position: absolute;
  top: 2px;
  left: 8px;
  font-size: 10.5px;
  letter-spacing: 2px;
  color: rgba(217, 187, 125, 0.5);
  white-space: nowrap;
}

.mh-era-band-new .mh-era-label {
  color: rgba(186, 146, 216, 0.55);
}

.mh-axis {
  position: absolute;
  left: 0;
  right: 0;
  top: 46px;
  height: 1px;
  background: linear-gradient(90deg, rgba(214, 183, 124, 0.12), rgba(214, 183, 124, 0.55), rgba(214, 183, 124, 0.12));
}

.mh-tick {
  position: absolute;
  top: 46px;
  width: 0;
  pointer-events: none;
}

.mh-tick i {
  position: absolute;
  left: 0;
  top: 0;
  width: 1px;
  height: 7px;
  background: rgba(214, 183, 124, 0.34);
}

.mh-tick span {
  position: absolute;
  left: 0;
  top: 34px;
  transform: translateX(-50%);
  font-size: 10.5px;
  letter-spacing: 0.5px;
  color: rgba(190, 180, 160, 0.55);
  font-variant-numeric: tabular-nums;
}

.mh-dot {
  position: absolute;
  width: 14px;
  height: 14px;
  margin-left: -7px;
  margin-top: -7px;
  padding: 0;
  border: 0;
  background: transparent;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}

.mh-dot i {
  display: block;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  transition: transform 140ms ease, box-shadow 140ms ease;
}

.mh-dot:hover i {
  transform: scale(1.5);
}

.mh-dot-on i {
  width: 9px;
  height: 9px;
  box-shadow: 0 0 0 3px rgba(214, 183, 124, 0.18), 0 0 10px rgba(214, 183, 124, 0.5);
}

.mh-playhead {
  position: absolute;
  top: 0;
  bottom: 6px;
  width: 0;
  pointer-events: none;
  z-index: 2;
}

.mh-playhead::after {
  content: "";
  position: absolute;
  left: -0.5px;
  top: 26px;
  bottom: 0;
  width: 1px;
  background: linear-gradient(180deg, rgba(217, 187, 125, 0.75), rgba(217, 187, 125, 0.1));
}

.mh-playhead-bubble {
  position: absolute;
  left: 0;
  top: 0;
  transform: translateX(-50%);
  padding: 2px 9px;
  border: 1px solid var(--mh-line-strong);
  border-radius: 999px;
  background: #141d28;
  font-size: 12.5px;
  font-weight: 600;
  letter-spacing: 0.5px;
  color: #f6ecd5;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

.mh-playhead-pin {
  position: absolute;
  left: -4.5px;
  top: 41.5px;
  width: 9px;
  height: 9px;
  transform: rotate(45deg);
  background: var(--mh-gold);
  box-shadow: 0 0 10px rgba(217, 187, 125, 0.72);
}

/* ------------------------------------------------------------- responsive */

@media (max-width: 1180px) {
  .mh-left {
    flex-basis: 286px;
    width: 286px;
  }
  .mh-right {
    flex-basis: 214px;
    width: 214px;
  }
  .mh-brand-title {
    font-size: 13.5px;
  }
  .mh-year {
    font-size: 30px;
  }
}

@media (max-width: 980px) {
  .mh-right {
    display: none;
  }
  .mh-left {
    flex-basis: 252px;
    width: 252px;
  }
}

@media (max-width: 720px) {
  .mh-left {
    display: none;
  }
  .mh-rail-hint {
    display: none;
  }
}

@media (prefers-reduced-motion: reduce) {
  .mh-pulse {
    animation: none;
  }
  .mh-dot i,
  .mh-btn,
  .mh-tab,
  .mh-index-row,
  .mh-zoom-btn {
    transition: none;
  }
}

/* ------------------------------------------------------------- fullscreen */

.mh-root:fullscreen {
  width: 100%;
  height: 100%;
  padding: 10px 18px 12px;
  background:
    radial-gradient(1100px 520px at 62% 12%, rgba(60, 88, 136, 0.22), transparent 72%),
    linear-gradient(180deg, #0b1119 0%, #080c12 68%);
}

.mh-root:fullscreen::backdrop {
  background: #080c12;
}

.mh-root.mh-immersive {
  position: fixed;
  inset: 0;
  z-index: 120;
  width: 100vw;
  height: 100vh;
  padding: var(--dsh-windows-titlebar-height, 0px) 18px 12px;
  background:
    radial-gradient(1100px 520px at 62% 12%, rgba(60, 88, 136, 0.22), transparent 72%),
    linear-gradient(180deg, #0b1119 0%, #080c12 68%);
}

.mh-root.mh-immersive::before {
  content: "";
  position: absolute;
  inset: 0 0 auto;
  height: var(--dsh-windows-titlebar-height, 0px);
  -webkit-app-region: drag;
  z-index: 3;
}

.mh-root:fullscreen .mh-left,
.mh-root.mh-immersive .mh-left {
  flex-basis: 396px;
  width: 396px;
}

.mh-root:fullscreen .mh-right,
.mh-root.mh-immersive .mh-right {
  flex-basis: 302px;
  width: 302px;
}

.mh-root:fullscreen .mh-index,
.mh-root.mh-immersive .mh-index {
  min-height: 120px;
}

.mh-root:fullscreen .mh-year,
.mh-root.mh-immersive .mh-year {
  font-size: 42px;
}

.mh-root:fullscreen .mh-title,
.mh-root.mh-immersive .mh-title {
  font-size: 26px;
}

.mh-root:fullscreen .mh-sec p,
.mh-root.mh-immersive .mh-sec p,
.mh-root:fullscreen .mh-points li,
.mh-root.mh-immersive .mh-points li {
  font-size: 14.5px;
}

.mh-root:fullscreen .mh-track,
.mh-root.mh-immersive .mh-track {
  height: 128px;
}

/* ------------------------------------------------------------ phone layout */

@media (max-width: 719px) {
  .mh-top {
    padding: 6px 10px 5px;
    gap: 8px;
  }

  .mh-year {
    font-size: 26px;
    letter-spacing: 1px;
  }

  .mh-brand {
    gap: 10px;
  }

  .mh-brand-title {
    font-size: 12px;
  }

  .mh-brand-sub {
    display: none;
  }

  .mh-badge,
  .mh-toggle {
    display: none;
  }

  .mh-controls {
    gap: 5px;
    margin-left: 0;
  }

  .mh-btn,
  .mh-select,
  .mh-tab {
    height: 34px;
    font-size: 13px;
  }

  .mh-body {
    padding: 8px 8px 0;
    gap: 8px;
  }

  .mh-rail {
    padding: 2px 12px 6px;
  }

  .mh-rail-top {
    padding: 0;
  }

  .mh-rail-hint {
    display: none;
  }

  .mh-track {
    height: 84px;
  }

  .mh-dot {
    width: 22px;
    height: 22px;
    margin-left: -11px;
    margin-top: -11px;
  }

  .mh-dot i {
    width: 9px;
    height: 9px;
  }

  .mh-map-hint {
    display: none;
  }

  .mh-map-tag {
    top: 8px;
    right: 9px;
  }

  .mh-map-legend {
    left: 8px;
    bottom: 8px;
    gap: 8px;
    font-size: 10.5px;
  }

  .mh-playhead-bubble {
    font-size: 12px;
  }

  .mh-sheet {
    display: flex;
    flex-direction: column;
    flex: 0 0 46px;
    min-height: 0;
    overflow: hidden;
    border-top: 1px solid var(--mh-line-strong);
    background: linear-gradient(180deg, rgba(18, 25, 35, 0.98), rgba(9, 13, 19, 0.99));
    padding-bottom: env(safe-area-inset-bottom, 0px);
    transition: flex-basis 200ms ease;
  }

  .mh-sheet-open {
    flex: 0 0 54%;
  }

  .mh-sheet-head {
    flex: 0 0 auto;
    padding: 4px 10px 4px;
  }

  .mh-sheet-handle {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    height: 32px;
    padding: 0 4px;
    border: 0;
    background: transparent;
    color: var(--mh-text);
    font-family: inherit;
    font-size: 13px;
    cursor: pointer;
  }

  .mh-sheet-grip {
    flex: 0 0 auto;
    width: 34px;
    height: 4px;
    border-radius: 2px;
    background: rgba(214, 183, 124, 0.45);
  }

  .mh-sheet-title {
    flex: 1 1 auto;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    text-align: left;
  }

  .mh-sheet-caret {
    flex: 0 0 auto;
    font-size: 11px;
    color: var(--mh-gold-soft);
  }

  .mh-sheet-tabs {
    display: flex;
    gap: 4px;
    padding: 0 4px 2px;
  }

  .mh-sheet-body {
    display: flex;
    flex: 1 1 auto;
    min-height: 0;
    overflow: hidden;
  }

  .mh-sheet .mh-left,
  .mh-sheet .mh-right {
    flex: 1 1 auto;

<script>
(function () {
  var root = document.getElementById('root');
  var definition = window.__DSH_DEF__;
  if (!definition || !window.React || !window.ReactDOM) {
    root.innerHTML = '<div class="boot">载入失败：缺少运行时</div>';
    return;
  }
  try {
    var app = definition.factory(function () { return window.React; });
    root.textContent = '';
    ReactDOM.createRoot(root).render(React.createElement(app.Panel));
  } catch (error) {
    root.innerHTML = '<div class="boot">渲染失败：' + String(error && error.message || error) + '</div>';
    throw error;
  }
})();
</script>
